# docker-compose.yml
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naka}
      POSTGRES_DB: ${POSTGRES_DB:-naka}
    ports:
      - "5432:5432"
    volumes:
      - naka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naka}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - naka_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naka_postgres_data:
  naka_redis_data:
