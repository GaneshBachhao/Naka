# backend/pyproject.toml
[project]
name = "naka"
version = "0.1.0"
description = "Naka — hyperlocal availability and routing platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "anthropic>=0.40",
    "pgvector>=0.3.6",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naka"]

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "alembic/versions"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TID251", # flake8-tidy-imports: banned-api (layer/context boundaries)
]

# Domain purity: no framework or I/O SDK imports inside any domain/ package.
# Cross-context isolation (a context's domain must never import another
# context's domain objects) is a separate concern, enforced by import-linter
# below instead of here — banned-api can't distinguish "naka.catalog.domain
# imported from outside catalog" from "naka.catalog.domain.entities importing
# its own sibling naka.catalog.domain.value_objects", since ruff resolves
# relative imports to their absolute form before matching. import-linter's
# `independence` contract type has no such blind spot.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi" = { msg = "Domain is pure Python. Route FastAPI through the API layer." }
"sqlalchemy" = { msg = "Domain is pure Python. Access persistence through a repository port." }
"httpx" = { msg = "Domain is pure Python. Call external services through a Port." }
"redis" = { msg = "Domain is pure Python. Access Redis through a Port." }
"anthropic" = { msg = "Domain is pure Python. Call AI providers through AIClientPort." }

[tool.ruff.lint.per-file-ignores]
"**/application/**" = ["TID251"]
"**/infrastructure/**" = ["TID251"]
"**/api/**" = ["TID251"]
"tests/**" = ["TID251"]
"src/naka/main.py" = ["TID251"]
"alembic/**" = ["TID251"]

# ---------------------------------------------------------------------------
# import-linter — bounded-context and layer boundaries
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["naka"]

[[tool.importlinter.contracts]]
name = "Bounded contexts: domain layers never import each other"
type = "independence"
modules = [
    "naka.catalog.domain",
    "naka.verification.domain",
    "naka.enquiry.domain",
    "naka.engagement.domain",
    "naka.identity.domain",
]

[[tool.importlinter.contracts]]
name = "shared never depends on a bounded context"
type = "forbidden"
source_modules = ["naka.shared"]
forbidden_modules = [
    "naka.catalog",
    "naka.verification",
    "naka.enquiry",
    "naka.engagement",
    "naka.identity",
]

[[tool.importlinter.contracts]]
name = "catalog: dependencies point inward only"
type = "layers"
layers = [
    "naka.catalog.api",
    "naka.catalog.infrastructure",
    "naka.catalog.application",
    "naka.catalog.domain",
]

[[tool.importlinter.contracts]]
name = "verification: dependencies point inward only"
type = "layers"
layers = [
    "naka.verification.api",
    "naka.verification.infrastructure",
    "naka.verification.application",
    "naka.verification.domain",
]

[[tool.importlinter.contracts]]
name = "enquiry: dependencies point inward only"
type = "layers"
layers = [
    "naka.enquiry.api",
    "naka.enquiry.infrastructure",
    "naka.enquiry.application",
    "naka.enquiry.domain",
]

[[tool.importlinter.contracts]]
name = "engagement: dependencies point inward only"
type = "layers"
layers = [
    "naka.engagement.api",
    "naka.engagement.infrastructure",
    "naka.engagement.application",
    "naka.engagement.domain",
]

[[tool.importlinter.contracts]]
name = "identity: dependencies point inward only"
type = "layers"
layers = [
    "naka.identity.api",
    "naka.identity.infrastructure",
    "naka.identity.application",
    "naka.identity.domain",
]

[[tool.importlinter.contracts]]
name = "shared: dependencies point inward only"
type = "layers"
layers = [
    "naka.shared.api",
    "naka.shared.infrastructure",
    "naka.shared.application",
    "naka.shared.domain",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=naka --cov-report=term-missing"
markers = ["integration: requires a live Postgres (see docker-compose.yml)"]

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.\\s*$", # Protocol method stubs have nothing to execute
]
